name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Exercise FSR2 on the newer inbox D3D12/WARP runtime (26100).
    runs-on: windows-2025
    steps:
      - name: Check out source and Jolt
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Configure and build game and tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) { throw 'No Visual Studio C++ toolchain was found.' }
          & (Join-Path $vsInstall 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          # Ninja uses the selected compiler without pinning a Visual Studio release.
          # Keep configure and build together so both inherit the developer environment.
          cmake -S . -B build-ci -G 'Ninja Multi-Config' -DCMAKE_CONFIGURATION_TYPES=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build every configured target, including all registered CTest executables.
          cmake --build build-ci --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run smoke tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MiniCity3D-test-diagnostics
          path: |
            build-ci/Testing/Temporary/*.log
            build-ci/Release/MiniCity3D.log
          if-no-files-found: ignore

      - name: Package game
        shell: pwsh
        run: ./package.ps1 -SkipBuild -SkipSmoke -PackageName 'MiniCity3D-build-${{ github.run_number }}' -Direct3DExecutable 'build-ci/Release/MiniCity3D.exe'

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: MiniCity3D-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v7
        with:
          name: MiniCity3D-windows
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mini City 3D build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
